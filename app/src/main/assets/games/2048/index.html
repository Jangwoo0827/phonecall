<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #faf8ef; color: #776e65; font-family: sans-serif; overflow: hidden; touch-action: none; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; height: 100%; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 44px; font-weight: 800; }
  .scores { display: flex; gap: 8px; }
  .box { background: #bbada0; color: #eee4da; border-radius: 6px; padding: 6px 14px; text-align: center; font-size: 12px; }
  .box b { display: block; color: #fff; font-size: 20px; }
  #board { position: relative; width: 100%; aspect-ratio: 1; background: #bbada0; border-radius: 8px; padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { border-radius: 6px; background: rgba(238, 228, 218, .35); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(22px, 8vw, 40px); }
  .v2 { background: #eee4da; } .v4 { background: #ede0c8; }
  .v8 { background: #f2b179; color: #f9f6f2; } .v16 { background: #f59563; color: #f9f6f2; }
  .v32 { background: #f67c5f; color: #f9f6f2; } .v64 { background: #f65e3b; color: #f9f6f2; }
  .v128 { background: #edcf72; color: #f9f6f2; font-size: clamp(20px, 7vw, 34px); }
  .v256 { background: #edcc61; color: #f9f6f2; font-size: clamp(20px, 7vw, 34px); }
  .v512 { background: #edc850; color: #f9f6f2; font-size: clamp(20px, 7vw, 34px); }
  .v1024, .v2048, .vbig { background: #edc22e; color: #f9f6f2; font-size: clamp(16px, 6vw, 28px); }
  button { background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 6px; padding: 12px; font-size: 16px; font-weight: 700; }
  #msg { text-align: center; min-height: 24px; font-weight: 700; }
  .hint { text-align: center; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="title">2048</div>
    <div class="scores">
      <div class="box">점수<b id="score">0</b></div>
      <div class="box">최고<b id="best">0</b></div>
    </div>
  </div>
  <div class="hint">화면을 밀어서 타일을 움직이세요</div>
  <div id="board"></div>
  <div id="msg"></div>
  <button id="new">새 게임</button>
</div>
<script>
(function () {
  var N = 4, grid, score, best = 0, over, won;
  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var msgEl = document.getElementById('msg');

  try { if (window.Native) best = Native.getBest() | 0; } catch (e) {}

  // The board survives leaving the game or the app (stored by the app through the Native bridge).
  function save() {
    try { if (window.Native) { if (over) Native.clearState(); else Native.saveState(JSON.stringify({ g: grid, s: score, w: won })); } } catch (e) {}
  }
  function restore() {
    try {
      if (!window.Native) return false;
      var t = Native.loadState(); if (!t) return false;
      var o = JSON.parse(t);
      if (!o.g || o.g.length !== N) return false;
      for (var r = 0; r < N; r++) if (!o.g[r] || o.g[r].length !== N) return false;
      grid = o.g; score = o.s | 0; won = !!o.w; over = false; render(); return true;
    } catch (e) { return false; }
  }

  function init() {
    grid = []; for (var r = 0; r < N; r++) grid.push([0, 0, 0, 0]);
    score = 0; over = false; won = false;
    addTile(); addTile(); render();
  }

  function addTile() {
    var empty = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    var p = empty[Math.floor(Math.random() * empty.length)];
    grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  // Slides one line toward index 0 and merges equal neighbours once.
  function slide(vals) {
    var a = vals.filter(function (x) { return x; }), gained = 0;
    for (var i = 0; i < a.length - 1; i++) {
      if (a[i] === a[i + 1]) { a[i] *= 2; gained += a[i]; a.splice(i + 1, 1); }
    }
    while (a.length < N) a.push(0);
    return { row: a, gained: gained };
  }

  // dir: 0 left, 1 up, 2 right, 3 down. Returns the cell coordinates of each line, ordered toward the move.
  function lines(dir) {
    var out = [];
    for (var i = 0; i < N; i++) {
      var line = [];
      for (var j = 0; j < N; j++) {
        var r, c;
        if (dir === 0) { r = i; c = j; }
        else if (dir === 2) { r = i; c = N - 1 - j; }
        else if (dir === 1) { r = j; c = i; }
        else { r = N - 1 - j; c = i; }
        line.push([r, c]);
      }
      out.push(line);
    }
    return out;
  }

  function move(dir) {
    if (over) return;
    var moved = false, gain = 0;
    lines(dir).forEach(function (line) {
      var res = slide(line.map(function (p) { return grid[p[0]][p[1]]; }));
      gain += res.gained;
      line.forEach(function (p, k) {
        if (grid[p[0]][p[1]] !== res.row[k]) { moved = true; grid[p[0]][p[1]] = res.row[k]; }
      });
    });
    if (!moved) return;
    score += gain;
    addTile();
    if (score > best) { best = score; submit(); }
    checkEnd();
    render();
  }

  function submit() { try { if (window.Native) Native.submitScore(score); } catch (e) {} }

  function checkEnd() {
    var full = true, can = false;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = grid[r][c];
      if (v === 2048 && !won) { won = true; msgEl.textContent = '2048 달성! 계속 해보세요'; }
      if (!v) full = false;
      if ((c < N - 1 && v === grid[r][c + 1]) || (r < N - 1 && v === grid[r + 1][c])) can = true;
    }
    if (full && !can) { over = true; msgEl.textContent = '게임 오버 · 점수 ' + score; submit(); }
  }

  function render() {
    scoreEl.textContent = score; bestEl.textContent = best;
    if (!over && !won) msgEl.textContent = '';
    boardEl.innerHTML = '';
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = grid[r][c], d = document.createElement('div');
      d.className = 'cell' + (v ? ' v' + (v > 2048 ? 'big' : v) : '');
      d.textContent = v || '';
      boardEl.appendChild(d);
    }
    save();
  }

  // Touch: swipe direction decides the move.
  var sx, sy;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0); else move(dy > 0 ? 3 : 1);
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    var k = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 }[e.key];
    if (k !== undefined) { e.preventDefault(); move(k); }
  });
  document.getElementById('new').addEventListener('click', init);

  if (!restore()) init();
})();
</script>
</body>
</html>
