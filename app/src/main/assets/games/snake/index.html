<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>스네이크</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #12281a; color: #e8f5e9; font-family: sans-serif; overflow: hidden; touch-action: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  .bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; }
  canvas { background: #1b3d27; border-radius: 8px; max-width: 100%; touch-action: none; }
  .hint { font-size: 13px; opacity: .7; text-align: center; min-height: 18px; }
</style>
</head>
<body>
<div id="app">
  <div class="bar"><span>점수 <span id="score">0</span></span><span>최고 <span id="best">0</span></span></div>
  <canvas id="c"></canvas>
  <div class="hint" id="hint">화면을 탭해서 시작 · 밀어서 방향 전환</div>
</div>
<script>
(function () {
  var COLS = 20, ROWS = 20;
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), hint = document.getElementById('hint');
  var cell, snake, dir, nextDir, apple, score, best = 0, running = false, dead = false, timer = null, delay;

  try { if (window.Native) best = Native.getBest() | 0; } catch (e) {}
  bestEl.textContent = best;

  function resize() {
    var size = Math.floor(Math.min(window.innerWidth - 24, window.innerHeight - 120, 480));
    cell = Math.floor(size / COLS);
    canvas.width = cell * COLS; canvas.height = cell * ROWS;
    draw();
  }

  // The game is kept paused where it was left (stored by the app through the Native bridge).
  var ticks = 0;
  function save() {
    try {
      if (!window.Native || !snake) return;
      if (dead) Native.clearState();
      else Native.saveState(JSON.stringify({ snake: snake, dir: dir, nextDir: nextDir, apple: apple, score: score, delay: delay }));
    } catch (e) {}
  }
  function restore() {
    try {
      if (!window.Native) return false;
      var t = Native.loadState(); if (!t) return false;
      var o = JSON.parse(t);
      if (!o.snake || o.snake.length < 3 || !o.dir || !o.apple) return false;
      snake = o.snake; dir = o.dir; nextDir = o.nextDir || o.dir; apple = o.apple; score = o.score | 0; delay = o.delay || 140; dead = false;
      scoreEl.textContent = score; hint.textContent = '이어하기 · 탭해서 계속';
      return true;
    } catch (e) { return false; }
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; delay = 140; dead = false;
    scoreEl.textContent = 0; placeApple();
  }

  function placeApple() {
    do { apple = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
    while (snake.some(function (s) { return s.x === apple.x && s.y === apple.y; }));
  }

  function start() {
    if (dead || !snake) reset();
    running = true; hint.textContent = '';
    clearTimeout(timer); tick();
  }

  function tick() {
    if (!running) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === apple.x && head.y === apple.y) {
      score++; scoreEl.textContent = score; delay = Math.max(60, delay - 3); placeApple();
    } else snake.pop();
    draw();
    if (++ticks % 4 === 0) save();
    timer = setTimeout(tick, delay);
  }

  function gameOver() {
    running = false; dead = true; draw();
    hint.textContent = '게임 오버 · 점수 ' + score + ' · 탭해서 다시 시작';
    if (score > best) { best = score; bestEl.textContent = best; }
    try { if (window.Native) Native.submitScore(score); } catch (e) {}
    save();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!snake) return;
    ctx.fillStyle = '#ef5350';
    ctx.beginPath(); ctx.arc((apple.x + .5) * cell, (apple.y + .5) * cell, cell * .4, 0, Math.PI * 2); ctx.fill();
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#c6ff6e' : '#66bb6a';
      ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
    });
    if (dead) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  }

  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return; // no instant reverse
    nextDir = { x: x, y: y };
  }

  var sx, sy;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (!running) start(); return; }
    if (!running) start();
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    var m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!m) return;
    e.preventDefault(); if (!running) start(); turn(m[0], m[1]);
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && running) { running = false; hint.textContent = '일시정지 · 탭해서 계속'; save(); } });
  window.addEventListener('resize', resize);

  if (!restore()) reset();
  resize();
})();
</script>
</body>
</html>
