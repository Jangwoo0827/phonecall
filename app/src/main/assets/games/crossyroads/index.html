<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfe6ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Crossy Chicks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='5' width='10' height='9' fill='%23fff' stroke='%23333'/%3E%3Crect x='6' y='2' width='4' height='3' fill='%23f33'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-qtRV9Lil.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BQW_EeuK.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud" class="hidden">
        <div id="score">0</div>
        <div id="coinBox"><span class="coin-icon"></span><span id="coinCount">0</span></div>
      </div>

      <button id="muteBtn" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>

      <section id="startScreen" class="screen">
        <div class="title-block">
          <h1>Crossy<br />Chicks</h1>
          <div class="best">최고 기록 <b id="startBest">0</b></div>
        </div>
        <div class="bottom-block">
          <div id="charPicker">
            <button id="prevChar" class="arrow-btn" aria-label="이전 캐릭터">◀</button>
            <div class="char-info">
              <div id="charName">병아리 닭</div>
              <div id="charStatus">사용 중</div>
            </div>
            <button id="nextChar" class="arrow-btn" aria-label="다음 캐릭터">▶</button>
          </div>
          <button id="unlockBtn" class="big-btn hidden">해금하기</button>
          <div id="startHint" class="pulse">탭하여 시작</div>
          <div class="wallet"><span class="coin-icon"></span><span id="walletCoins">0</span></div>
        </div>
      </section>

      <section id="overScreen" class="screen hidden">
        <div class="panel">
          <h2 id="overTitle">게임 오버</h2>
          <div class="score-big" id="overScore">0</div>
          <div class="over-stats">
            <div>최고 기록 <b id="overBest">0</b></div>
            <div><span class="coin-icon"></span> 이번 코인 <b id="overCoins">0</b></div>
          </div>
          <div id="newBest" class="new-best hidden">🎉 새로운 최고 기록!</div>
          <button id="retryBtn" class="big-btn">다시 하기</button>
          <button id="menuBtn" class="small-btn">캐릭터 / 메인으로</button>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
    </div>
  </body>
</html>
