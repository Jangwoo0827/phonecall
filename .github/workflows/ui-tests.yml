name: UI tests

# Runs the emulator tests (app/src/androidTest) on every push to main. They catch things the unit tests cannot: a crash on
# a fresh install, a screen that no longer opens, a button that stopped working. Takes about 15 minutes.
# It also runs as the gate of a release: release.yml calls it (workflow_call) and only builds the APK when it is green.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "supabase/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The emulator needs hardware acceleration; GitHub's Linux runners have it once the device is made accessible.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      # The job log needs a sign-in to read; annotations are public. So name the failed tests (and why) as annotations.
      - name: Name the failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          found = False
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              text = open(path, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure[^>]*>(.*?)</failure>', text, re.S):
                  found = True
                  why = ' '.join(m.group(3).split())[:400].replace('%', '%25')
                  print('::error title=UI test failed::' + m.group(2).split('.')[-1] + '.' + m.group(1) + ': ' + why)
          if not found:
              print('::error title=UI tests::no failed test was recorded (the emulator or the build failed before the tests ran)')
          PY

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
