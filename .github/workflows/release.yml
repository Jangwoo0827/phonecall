name: Release APK

# Pushing a tag like v0.2.0 builds a signed release APK and attaches it to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails early with a readable reason (missing secret, broken base64, wrong password/alias) instead of a bare exit code.
      # Secret values are never printed.
      - name: Decode and check signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TMP="$RUNNER_TEMP"
          fail() { echo "::error::$1"; exit 1; }

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || fail "Secret $name is empty or not set. Create it under Settings > Secrets and variables > Actions > Secrets (not Variables), spelled exactly like this."
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n"' > "$TMP/keystore.b64"
          if ! base64 --decode "$TMP/keystore.b64" > "$TMP/release.jks" 2>/dev/null; then
            fail "KEYSTORE_BASE64 is not valid base64 (${#KEYSTORE_BASE64} characters). Copy it again with the PowerShell command from the README and paste the whole thing."
          fi

          # keytool reports its errors on stdout, so capture both streams. The password is only passed as an argument.
          if ! keytool -list -keystore "$TMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$TMP/keytool.out" 2>&1; then
            reason="$(grep -m1 -iE 'error|exception' "$TMP/keytool.out" | cut -c1-160)"
            fail "The keystore could not be opened with these secrets (${reason:-no details}). Check KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS."
          fi
          echo "keystore OK (alias $KEY_ALIAS)"
          echo "KEYSTORE_FILE=$TMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # v1.2.3 -> versionName 1.2.3; the run number keeps versionCode increasing so updates install over each other.
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "SuperDialer-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SuperDialer-${{ github.ref_name }}.apk
          generate_release_notes: true
